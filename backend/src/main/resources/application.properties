spring.application.name=pan-pos-backend
server.port=8080

# PostgreSQL — change credentials as needed
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/panpos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS — comma-separated extra origins (e.g. your Render frontend URL)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
